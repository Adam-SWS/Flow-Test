<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flow Rate Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
}

.calculator{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

input{
    width:80px;
    padding:6px;
}

#result{
    font-weight:bold;
    color:#0070c0;
}
</style>

<script>
function calc(){
    let bucket=parseFloat(document.getElementById("bucket").value);
    let time=parseFloat(document.getElementById("time").value);

    if(bucket>0 && time>0){
        let flow=(bucket/time)*60*0.8;
        document.getElementById("result").innerHTML=
            flow.toFixed(1)+" L/min";
    }
}
</script>
</head>

<body>

<div class="calculator">

Bucket Size (L)

<input
type="number"
id="bucket"
oninput="calc()">

Fill Time (s)

<input
type="number"
id="time"
oninput="calc()">

<span id="result"></span>

</div>

<p style="font-size:12px;color:#666;">
Flow rate includes a 20% allowance for friction loss.
</p>

</body>
</html>
